<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ZENITH LANCER</title>
<meta name="description" content="ZENITH LANCER: a horizontal shooting game for the browser">
<style>
:root {
    --bg: #07080d;
    --panel: #11131c;
    --line: #262a3a;
    --text: #c9cede;
    --dim: #7c8296;
    --accent: #e8c25a;
    --key: #1c2030;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
body { display: flex; flex-direction: column; align-items: center; overflow: hidden;
    -webkit-user-select: none; user-select: none; touch-action: none; }
#stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; position: relative; }
#screen { image-rendering: pixelated; image-rendering: crisp-edges; background: #000;
    box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.6); }
#bar { width: 100%; display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap;
    padding: 8px 16px 12px; color: var(--dim); font-size: 13px; }
#bar .keys { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
kbd { display: inline-block; min-width: 1.6em; padding: 0 5px; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; background: var(--key); color: var(--text); font: 12px/1.6 ui-monospace, Consolas, monospace; text-align: center; }
button.tool { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 10px; font: inherit; cursor: pointer; }
button.tool:hover { border-color: var(--dim); }
#overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(4,5,9,.72); cursor: pointer; }
#overlay .box { text-align: center; padding: 24px 32px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); max-width: 90vw; }
#overlay h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .12em; color: var(--accent); }
#overlay p { margin: 6px 0; color: var(--dim); }
#overlay .go { margin-top: 14px; color: var(--text); font-weight: 600; }
#overlay.hidden { display: none; }
/* touch pad */
#touch { display: none; position: absolute; inset: 0; pointer-events: none; }
body.touch #touch { display: block; }
body.touch #bar .keys { display: none; }
.tp { position: absolute; pointer-events: auto; border-radius: 50%; border: 2px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.08); color: rgba(255,255,255,.7); display: flex; align-items: center; justify-content: center;
    font: 600 15px system-ui, sans-serif; }
.tp.on { background: rgba(232,194,90,.35); }
#tp-stick { left: 16px; bottom: 16px; width: 140px; height: 140px; }
#tp-stick .knob { width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.25); transform: translate(0,0); }
#tp-a { right: 16px; bottom: 28px; width: 76px; height: 76px; }
#tp-b { right: 104px; bottom: 16px; width: 60px; height: 60px; }
#tp-start { right: 24px; top: 16px; width: 64px; height: 34px; border-radius: 17px; font-size: 12px; }
#loading { color: var(--dim); }
</style>
</head>
<body>
<div id="stage">
    <canvas id="screen" width="320" height="224"></canvas>
    <div id="overlay">
        <div class="box">
            <h1>ZENITH LANCER</h1>
            <p>横スクロールシューティング</p>
            <p id="loading">読み込み中…</p>
            <p class="go" id="go" hidden>クリック / タップ / キーで開始</p>
        </div>
    </div>
    <div id="touch">
        <div class="tp" id="tp-stick"><div class="knob"></div></div>
        <div class="tp" id="tp-a">SHOT</div>
        <div class="tp" id="tp-b">POWER</div>
        <div class="tp" id="tp-start">START</div>
    </div>
</div>
<div id="bar">
    <div class="keys">
        <span><kbd>←↑↓→</kbd> / <kbd>WASD</kbd> 移動</span>
        <span><kbd>Z</kbd> <kbd>C</kbd> <kbd>Space</kbd> ショット</span>
        <span><kbd>X</kbd> パワーアップ</span>
        <span><kbd>Enter</kbd> スタート / ポーズ</span>
        <span>ゲームパッド対応</span>
    </div>
    <button class="tool" id="mute" title="サウンド (M)">♪ ON</button>
    <button class="tool" id="full" title="全画面 (F)">全画面</button>
</div>
<script src="data/assets.js"></script>
<script src="js/gen_assets.js"></script>
<script src="js/display.js"></script>
<script src="js/system.js"></script>
<script src="js/globals.js"></script>
<script src="js/video.js"></script>
<script src="js/mathx.js"></script>
<script src="js/stage.js"></script>
<script src="js/player.js"></script>
<script src="js/enemy.js"></script>
<script src="js/boss.js"></script>
<script src="js/boss1.js"></script>
<script src="js/boss2.js"></script>
<script src="js/boss3.js"></script>
<script src="js/boss4.js"></script>
<script src="js/boss5.js"></script>
<script src="js/boss6.js"></script>
<script src="js/level.js"></script>
<script src="js/scripts.js"></script>
<script src="js/hud.js"></script>
<script src="js/fx.js"></script>
<script src="js/game.js"></script>
<script src="js/menu.js"></script>
<script src="js/options.js"></script>
<script src="js/ending.js"></script>
<script src="js/autoplay.js"></script>
<script src="js/audio.js"></script>
<script src="music/loops.js"></script>
<script src="js/main.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
